name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge (rebase)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.number }} \
            --auto \
            --rebase \
            --delete-branch \
            --repo ${{ github.repository }}
